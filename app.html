function choosePracticeWords(pool,count){const seen=seenWordIds();const now=Date.now();const due=[],flashReview=[],newWords=[],others=[];for(const w of pool){const related=allSkills.map(skill=>state.progress[wordKey(w,skill)]).filter(Boolean);if(related.some(p=>new Date(p.due_at||0).getTime()<=now))due.push(w);else if(flashAssessment(w.id)&&flashNeedsReview(w.id))flashReview.push(w);else if(!seen.has(String(w.id)))newWords.push(w);else others.push(w)}

  x.id!==w.id && x.simplified!==w.simplified &&
  getText(x).toLowerCase()!==correct.toLowerCase() &&
  (type!=='pinyin'||normalizePy(getText(x))!==normalizePy(correct))

  const answer=getText(x), lengthGap=Math.abs([...x.simplified].length-targetLen);

function normalizePy(s){return String(s??'').toLowerCase().trim()

 const nextDelay=result==='correct'?(mastery>=90?7:mastery>=70?3:mastery>=40?1:.5)*86400000:result==='unknown'?30*60000:3*3600000;
 state.progress[key]={mastery,repetitions:previous.repetitions+1,lapses:previous.lapses+(result==='wrong'?1:0),due_at:new Date(now+nextDelay).toISOString(),last_reviewed_at:new Date(now).toISOString()};state.attempts.push({id:w.id,skill,type:q.type,result,at:new Date(now).toISOString()});saveSaved();renderFeedback(result)}
function renderFeedback(result){const quiz=state.quiz,q=quiz.questions[quiz.index],w=q.word,positive=result==='correct';show(`<div class="feedback"><span class="feedback-emoji">${positive?'🍊':result==='unknown'?'📖':'💛'}</span><h1 class="${positive?'positive':'negative'}">${positive?'Correct!':result==='unknown'?"Let's learn it.":'Not quite!'}</h1><p class="subline">${positive?'Lovely work. Keep going!':result==='unknown'?'No problem — this word will come back for revision.':'The answer is below. You will see this word again.'}</p><div class="feedback-card"><div class="hanzi">${escapeHTML(w.simplified)}</div><div class="pronounce">${escapeHTML(w.pinyin)}</div><div class="meaning">${escapeHTML(w.meaning)}</div><button class="audio-button" onclick="playAudio(${w.id})">🔊</button></div><button class="btn btn-primary btn-big" onclick="nextQuestion()">${quiz.index+1===quiz.questions.length?'FINISH':'CONTINUE'}</button></div>`)}
function nextQuestion(){if(!state.quiz)return;state.quiz.index++;renderQuestion()}
function quitPractice(){const q=state.quiz,wasLesson=!!q?.lessonId;state.quiz=null;go(wasLesson?'learn':'home')}
function renderResults(){const q=state.quiz;if(!q)return go('home');const done=q.questions.length,score=Math.round(100*q.correct/done);const again=q.lessonId?`startPractice(${q.lessonId})`:'startPractice()';show(`<div class="feedback"><div class="feedback-emoji">🍊</div><h1>Practice complete!</h1><p class="subline">Keep showing up. Those words will stick.</p><div class="score-card"><p>YOUR SCORE</p><strong>${score}%</strong><p>${q.correct} correct · ${q.wrong} incorrect · ${q.unknown} don't know</p><div class="track"><span style="width:${score}%"></span></div></div><button class="btn btn-primary btn-big" onclick="${again}">PRACTISE AGAIN</button><div style="height:14px"></div><button class="btn btn-white btn-full" onclick="go('${q.lessonId?'learn':'home'}')">BACK TO ${q.lessonId?'LEARN':'HOME'}</button></div>`);state.quiz=null}
function renderWordBank(){state.route='wordbank';show(`${notice()}<div class="header-back"><button class="back" onclick="go('learn')">← BACK TO LEARN</button></div><h1 class="screen-title">Word Bank</h1><p class="subline">Search Chinese, Pinyin or English.</p><input class="search" id="word-search" placeholder="Search all ${state.words.length} words..." oninput="filterBank()" aria-label="Search vocabulary"><div class="meta-text" id="bank-meta"></div><div id="word-results"></div><p class="compact-note">Translations are concise learner glosses awaiting final editorial review. Audio sources: <a href="https://github.com/hugolpz/audio-cmn" target="_blank" rel="noopener noreferrer">audio-cmn</a> (CC BY-SA).</p>`);filterBank()}
function filterBank(){const q=String($('word-search')?.value||'').trim().toLowerCase();const list=state.words.filter(w=>[w.simplified,w.pinyin,w.meaning].some(s=>s.toLowerCase().includes(q)));$('bank-meta').textContent=`${list.length} matching words${list.length>80?' · first 80 shown':''}`;$('word-results').innerHTML=list.slice(0,80).map(w=>`<button class="word-row" onclick="openWord(${w.id})"><span class="hanzi">${escapeHTML(w.simplified)}</span><span class="details"><b>${escapeHTML(w.pinyin)}</b><small>${escapeHTML(w.meaning)}</small></span><span class="arrow">›</span></button>`).join('')||'<p class="subline">No matching words.</p>'}
function openWord(id){const w=currentWord(id);if(!w)return;modal(`<div class="modal-header"><h2>Word reference</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div><div class="center"><div class="hanzi" style="font-size:68px;color:var(--orange-dark)">${escapeHTML(w.simplified)}</div><p style="font-size:21px;font-weight:900;color:#B45B31;margin:8px 0">${escapeHTML(w.pinyin)}</p><p style="font-size:17px;font-weight:800">${escapeHTML(w.meaning)}</p><button class="audio-button" onclick="playAudio(${w.id})">🔊 Listen</button><div style="height:17px"></div><button class="btn btn-soft btn-full" onclick="openStrokes(${w.id})">✍️ View stroke order</button></div>`)}
function renderProgress(){const seen=seenWordIds().size,answered=state.attempts.filter(a=>a.result!=='unknown'),correct=answered.filter(a=>a.result==='correct').length,accuracy=answered.length?Math.round(100*correct/answered.length):0,weak=state.words.filter(w=>allSkills.some(s=>state.progress[wordKey(w,s)]&&state.progress[wordKey(w,s)].mastery<45)).slice(0,7);show(`${notice()}<h1 class="screen-title">Your Progress</h1><p class="subline">A simple picture of what's sticking.</p><div class="stats-pair"><div class="stat-card"><div class="stat-icon">📚</div><div class="stat-value">${masteredWords()}</div><div class="stat-caption">Mastered / ${state.words.length}</div></div><div class="stat-card peach"><div class="stat-icon">🎯</div><div class="stat-value">${accuracy}%</div><div class="stat-caption">Quiz Accuracy</div></div></div><div class="white-card"><h3>Vocabulary</h3><div class="goal-head"><span>Words encountered</span><span>${seen} / ${state.words.length}</span></div><div class="track"><span style="width:${100*seen/state.words.length}%"></span></div></div><div class="white-card"><h3>Knowledge by skill</h3>${[['meaning','Meanings'],['recognition','Recognition'],['pinyin','Pinyin & tones'],['listening','Listening']].map(([skill,text])=>`<div class="skill-line"><div><span>${text}</span><span>${skillPercent(skill)}%</span></div><div class="track"><span style="width:${skillPercent(skill)}%"></span></div></div>`).join('')}<p class="compact-note">A word's flashcard confidence rating does not automatically count as quiz mastery.</p></div><div class="white-card"><h3>Words to revisit</h3>${weak.length?weak.map(w=>`<div class="activity-row"><b class="hanzi" style="font-size:20px">${escapeHTML(w.simplified)}</b><small>${escapeHTML(w.pinyin)} · ${escapeHTML(primaryMeaning(w))}</small></div>`).join(''):'<p class="subline" style="margin:0">Your weaker words will appear here as you practise.</p>'}</div><button class="btn btn-primary btn-big" onclick="startPractice()">START PRACTICE</button><p class="footer-tip"><span id="cloud-sync-status">☁️ Your progress is linked to your account.</span></p>`)}
function toggleLevel(){const box=$('level-menu');const open=!box.classList.contains('hidden');if(open)return closeLevel();box.innerHTML=Array.from({length:9},(_,i)=>{const lvl=i+1,ready=lvl<=2&&!state.offline;const available=lvl===1||ready;return `<button type="button" ${available?'onclick="switchLevel('+lvl+')"':'disabled'} ${state.selectedLevel===lvl?'class="current"':''}>HSK ${lvl}<small>${state.selectedLevel===lvl?'Current':available?'Available':'Soon'}</small></button>`}).join('');box.classList.remove('hidden');$('level-button').setAttribute('aria-expanded','true')}
function switchLevel(level){if(!Number.isInteger(level)||level<1||level>2||(state.offline&&level>1))return;state.selectedLevel=level;updateActiveWords();state.lesson=null;state.flash=null;state.quiz=null;go('home')}
function closeLevel(){const b=$('level-menu');if(b)b.classList.add('hidden');$('level-button')?.setAttribute('aria-expanded','false')}
function modal(body){$('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${body}</div></div>`}
function closeModal(){state.writer=null;$('modal-root').innerHTML=''}
function openStrokes(id){const w=currentWord(id);if(!w)return;state.strokeChars=[...w.simplified].filter(c=>/\p{Script=Han}/u.test(c));state.strokeIndex=0;renderStrokeModal()}
function renderStrokeModal(){const chars=state.strokeChars,c=chars[state.strokeIndex];if(!c)return;modal(`<div class="modal-header"><h2>Stroke order</h2><button class="modal-close" onclick="closeModal()" aria-label="Close">×</button></div><div class="char-switch">${chars.map((ch,i)=>`<button class="${state.strokeIndex===i?'active':''}" onclick="state.strokeIndex=${i};renderStrokeModal()">${escapeHTML(ch)}</button>`).join('')}</div><div class="stroke-canvas" id="stroke-canvas"><span class="hanzi">${escapeHTML(c)}</span></div><p class="stroke-note">Watch the stroke sequence, then practise writing on paper.</p><button class="btn btn-soft btn-full" onclick="replayStrokes()">▶ Replay strokes</button><p class="compact-note center">Stroke data: <a href="https://github.com/chanind/hanzi-writer-data" target="_blank" rel="noopener noreferrer">Hanzi Writer Data</a> (Arphic Public License).</p>`);setTimeout(()=>initStrokes(c),30)}
function initStrokes(char){if(!window.HanziWriter)return;const target=$('stroke-canvas');if(!target)return;try{target.innerHTML='';const ref=state.characterRefs.get(char)||`https://raw.githubusercontent.com/chanind/hanzi-writer-data/${STROKE_REVISION}/data/${encodeURIComponent(char)}.json`;state.writer=HanziWriter.create('stroke-canvas',char,{width:270,height:270,padding:15,strokeColor:'#D96B41',outlineColor:'#F0D6C8',highlightColor:'#FFBA87',showOutline:true,showCharacter:false,charDataLoader:(c,done)=>fetch(ref).then(r=>{if(!r.ok)throw Error('unavailable');return r.json()}).then(done).catch(()=>{const box=$('stroke-canvas');if(box)box.innerHTML=`<span class="hanzi" style="font-size:100px">${escapeHTML(char)}</span>`})});state.writer.animateCharacter()}catch(e){target.innerHTML=`<span class="hanzi" style="font-size:100px">${escapeHTML(char)}</span>`}}
function replayStrokes(){state.writer?.animateCharacter()}
function playAudio(wordId){const w=currentWord(wordId);if(!w)return;const url=state.audio.get(w.id);const speak=()=>{if(!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.simplified);u.lang='zh-CN';u.rate=.82;window.speechSynthesis.speak(u)};if(url){const a=new Audio(url);a.play().catch(speak)}else{speak()}}
document.addEventListener('click',e=>{if(!e.target.closest('.level-control'))closeLevel()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeLevel();closeModal()}});
</script>
<script src="auth.js"></script>
</body>
